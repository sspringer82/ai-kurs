# Qdrant als lokale Vektordatenbank
# Start: docker compose up -d   |   Dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: workshop-qdrant
    ports:
      - '6333:6333' # REST-API + Dashboard
      - '6334:6334' # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
